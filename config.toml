# Turing Screen settings. Most of these are also in the control panel; what the panel changes is saved in
# state.json, which overrides this file. Restart the app after editing (tray icon > Quit, then start it again).

[screen]
port = "AUTO"              # or "COM3"
orientation = "portrait"   # portrait | reverse_portrait | landscape | reverse_landscape
brightness = 50            # 0-100. These screens run hot at full brightness; 50-60 is a good everyday level

[display]
mode = "stats"             # stats | detail | gif | clock
idle = "clock"             # while Windows is locked or the monitors are off: "clock" or "off"
idle_brightness = 25       # brightness of the idle clock
clock_seconds = true       # thin seconds bar under the clock
clock_color = "#38bdf8"    # colour of the clock's minutes and seconds bar
calm = true                # Big stats: redraw a number only when it really changed
hide_redraws = true        # switching mode/GIF: screen goes dark while the new picture loads, instead of a wipe

[bigstats]                 # what Big stats shows; the rest grows to fill the screen
clock = true
cpu = true
gpu = true
ram = true
net = false

[dark]
on_sleep = true            # screen off when the PC sleeps (nothing can update it then)
on_exit = true             # screen off when the app quits or the PC shuts down

[stats]
interval = 1.0             # seconds between updates
drives = "auto"            # or a list, e.g. ["C:\\", "D:\\"]
network_interface = "auto" # or an adapter name, e.g. "Ethernet"
temp_unit = "C"            # C or F (GPU temperature)
clock_24h = true

[gif]
folder = "gifs"
fit = "cover"              # cover = fill the screen | contain = whole GIF | original = native size, centered
slideshow = false
switch_seconds = 30        # slideshow: next GIF after this long
max_fps = 20
denoise = 12               # noise clean-up for GIFs: 0 = off, 12 = normal, 20 = strong

[app]
tray = true
link_kbps = 120            # measured automatically; used for the GIF speed estimates
